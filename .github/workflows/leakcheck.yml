name: Leak gate

# Runs on every push and every pull request, on every branch. Nobody can skip
# it. It stands between a commit and a reader.
#
# Three scanners run over the whole tree:
#   leakcheck   credential shapes, machine names, account ids, IP addresses
#               (the checker that every public RunOS repository carries)
#   denycheck   internal references: tracking and review ids, internal hosts,
#               dates, the custody design of keys, and a hashed list of names
#   gitleaks    a general secret scanner over the files and the history

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  leakcheck:
    name: Leak gate (whole tree)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # gitleaks reads the history as well.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Report the checker version
        run: python3 scripts/leakcheck.py --version

      - name: leakcheck
        run: python3 scripts/leakcheck.py

      # leakcheck reads UTF-8 text only. An unreadable tracked file is a hard
      # failure instead of a silent gap.
      - name: Every tracked file must be one leakcheck can read
        run: python3 scripts/unscannable_check.py

      - name: Test the checker itself
        run: python3 scripts/leakcheck_test.py

      - name: denycheck
        run: python3 scripts/denycheck.py

      # Pinned to an exact version; Go checks the module against the checksum
      # database.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: gitleaks (files and history)
        run: |
          gitleaks dir . --no-banner --redact
          gitleaks git . --no-banner --redact
