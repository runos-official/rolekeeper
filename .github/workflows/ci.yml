name: CI

# Work lands on dev by pull request and main records what shipped, so CI runs
# on pushes to both and on pull requests into both. A branch that is neither is
# covered by the Leak gate workflow, which runs on every branch.
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: gofmt lists no file
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt lists these files; run gofmt -w on them:"
            echo "$unformatted"
            exit 1
          fi

      - name: go.mod and go.sum are tidy and verified
        run: |
          go mod tidy -diff
          go mod verify

      - name: Run go vet
        run: go vet ./...

      # The production build is CGO-free. Verify it builds with CGO off so a C
      # dependency cannot creep back in and break the static image.
      - name: Build (CGO off)
        env:
          CGO_ENABLED: "0"
        run: go build ./...

      # The race detector needs cgo; the runner ships gcc.
      - name: Run tests
        env:
          CGO_ENABLED: "1"
        run: go test -count=1 -race ./...

  leak-gates:
    name: Leak gates
    # The gates live in one workflow, which also runs on its own for every
    # other branch, so there is one place that can drift.
    uses: ./.github/workflows/leakcheck.yml

  analysis:
    name: staticcheck and govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      # The tools are pinned to exact versions. Go checks the downloaded module
      # against the checksum database.
      - name: Install staticcheck and govulncheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.2.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0

      - name: staticcheck
        run: staticcheck ./...

      - name: govulncheck
        run: govulncheck ./...

  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: VERSION has a section in CHANGELOG.md
        run: |
          v="$(cat VERSION)"
          grep -q "^## v${v}\$" CHANGELOG.md || { echo "CHANGELOG.md has no section for v${v}"; exit 1; }

  image:
    name: Image build (linux/amd64, no push)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          build-args: |
            VERSION=ci
